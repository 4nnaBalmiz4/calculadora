<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>

    <h1>Calculadora</h1>

    <input type="number" id="numero1" placeholder="Primeiro número">

    <input type="number" id="numero2" placeholder="Segundo número">

    <br><br>

    <button onclick="calcular('+')">+</button>
    <button onclick="calcular('-')">-</button>
    <button onclick="calcular('*')">×</button>
    <button onclick="calcular('/')">÷</button>

    <h2>Resultado: <span id="resultado">0</span></h2>

    <script>
        function calcular(operacao) {

            let numero1 = Number(document.getElementById("numero1").value);
            let numero2 = Number(document.getElementById("numero2").value);

            let resultado;

            if (operacao === '+') {
                resultado = numero1 + numero2;
            } 
            else if (operacao === '-') {
                resultado = numero1 - numero2;
            } 
            else if (operacao === '*') {
                resultado = numero1 * numero2;
            } 
            else if (operacao === '/') {

                if (numero2 === 0) {
                    document.getElementById("resultado").innerText = "Não é possível dividir por zero";
                    return;
                }

                resultado = numero1 / numero2;
            }

            document.getElementById("resultado").innerText = resultado;
        }
    </script>

</body>
</html>
